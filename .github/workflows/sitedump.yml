name: Site dump (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sitedump.yml", "lasun/core.py"]

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ATB pages
        run: |
          mkdir dump
          python - <<'PY'
          import re, time
          from lasun.core import http_get, SITE
          def get(name, path):
              try:
                  h = http_get(SITE + path) or ""
              except Exception as e:
                  h = "ERROR %r" % e
              open("dump/" + name, "w", encoding="utf-8").write(h)
              print(name, len(h))
              time.sleep(2)
              return h
          a = get("morozivo.html", "/catalog/334-morozivo")
          b = get("morozivo-p2.html", "/catalog/334-morozivo?page=2")
          get("yogurti.html", "/catalog/349-yogurti")
          get("rud.html", "/product/morozivo-05-kg-rud-100-morozivo")
          m = re.search(r'/product/([^"]*limo[^"]*1965[^"]*)"', a + b)
          if m:
              get("limo.html", "/product/" + m.group(1))
          PY
      - name: Push to dump branch
        run: |
          cd dump
          git init -q -b sitedump
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm dump
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sitedump
